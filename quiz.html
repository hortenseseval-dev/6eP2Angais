<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6A – Révision vocabulaire</title>
<style>
  :root{--bg:#fdf8ef;--ink:#1f2a44;--blue:#1d4ed8;--red:#dc2626;--green:#15803d;--yellow:#fde68a;--purple:#9333ea;--card:#fff;--muted:#64748b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",Arial,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:1vw;padding:1.5vh 2vw;background:#fff;box-shadow:0 .4vh 0 rgba(0,0,0,.06);flex-wrap:wrap}
  header h1{font-size:3.6vh;color:var(--blue)}
  .teams{display:flex;gap:1.5vw;align-items:center}
  .team{display:flex;align-items:center;gap:.6vw;font-size:3vh;padding:.6vh 1.2vw;border-radius:99px;color:#fff}
  .team.a{background:var(--blue)} .team.b{background:var(--red)}
  .team button{background:#fff3;box-shadow:none;padding:.2vh 1vw;font-size:2.6vh}
  .team b{min-width:3vw;text-align:center;font-size:3.6vh}
  main{padding:2vh 3vw 4vh;display:flex;flex-direction:column;align-items:center;gap:2.5vh}
  button{font-family:inherit;font-size:2.8vh;padding:1.2vh 2vw;border:none;border-radius:99px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 .5vh 0 rgba(0,0,0,.18)}
  button:active{transform:translateY(.3vh);box-shadow:none}
  button.alt{background:var(--green)} button.warn{background:var(--red)} button.ghost{background:#e2e8f0;color:var(--ink)}
  .btns{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center}
  .menu{display:grid;grid-template-columns:repeat(3,minmax(24vw,1fr));gap:2.5vh 2vw;width:100%;max-width:1400px}
  .mode{background:var(--card);border-radius:3vh;padding:3vh 2vw;box-shadow:0 .8vh 0 rgba(0,0,0,.08);cursor:pointer;text-align:center;border:.5vh solid transparent}
  .mode:hover{border-color:var(--yellow)}
  .mode .i{font-size:9vh}
  .mode h2{font-size:3.6vh;color:var(--blue);margin:.6vh 0}
  .mode p{font-size:2.4vh;color:var(--muted)}
  .cats{display:flex;flex-wrap:wrap;gap:1vh 1vw;justify-content:center;max-width:1400px}
  .cats label{background:#fff;border-radius:99px;padding:.8vh 1.4vw;font-size:2.4vh;cursor:pointer;box-shadow:0 .4vh 0 rgba(0,0,0,.06);user-select:none}
  .cats input{transform:scale(1.4);margin-right:.6vw}
  h2.title{font-size:5vh;color:var(--blue)}
  .sub{font-size:2.6vh;color:var(--muted)}
  .big{background:var(--card);border-radius:3vh;padding:3vh 4vw;box-shadow:0 .8vh 0 rgba(0,0,0,.08);min-width:50vw;min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
  .pic{font-size:20vh;line-height:1.05}
  .pic.txt{font-size:6vh;color:var(--purple);border:.5vh dashed #d8b4fe;border-radius:2vh;padding:2vh 3vw}
  .fr{font-size:4vh;color:var(--muted)}
  .ans{font-size:6vh;font-weight:bold;color:var(--green);min-height:7vh}
  .ans.hidden{visibility:hidden}
  input.write{font-family:inherit;font-size:5vh;padding:1vh 2vw;border-radius:2vh;border:.5vh solid #cbd5e1;text-align:center;width:50vw}
  input.write.ok{border-color:var(--green);background:#dcfce7} input.write.ko{border-color:var(--red);background:#fee2e2}
  .choices{display:grid;grid-template-columns:repeat(2,minmax(30vw,1fr));gap:2vh 2vw}
  .choice{background:var(--card);border-radius:2.5vh;padding:2vh 2vw;box-shadow:0 .6vh 0 rgba(0,0,0,.08);cursor:pointer;font-size:4vh;display:flex;align-items:center;justify-content:center;gap:1.5vw;min-height:16vh;border:.5vh solid transparent}
  .choice .e{font-size:10vh}
  .choice.ok{border-color:var(--green);background:#dcfce7} .choice.ko{border-color:var(--red);background:#fee2e2}
  .memo{display:grid;gap:1.6vh 1.2vw;width:100%;max-width:1500px}
  .mc{perspective:1000px;height:20vh;cursor:pointer}
  .mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
  .mc.flip .in,.mc.done .in{transform:rotateY(180deg)}
  .mc .f,.mc .b{position:absolute;inset:0;border-radius:2vh;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 .6vh 0 rgba(0,0,0,.1);text-align:center;padding:1vh}
  .mc .f{background:linear-gradient(135deg,#1d4ed8,#9333ea);color:#fff;font-size:7vh}
  .mc .b{background:#fff;transform:rotateY(180deg);font-size:3.2vh;font-weight:bold}
  .mc .b .e{font-size:11vh;font-weight:normal}
  .mc.done .b{background:#dcfce7}
  .grid6{display:grid;grid-template-columns:repeat(3,22vw);gap:2vh 2vw}
  .card{background:var(--card);border-radius:2.5vh;padding:1.5vh 1vw;box-shadow:0 .6vh 0 rgba(0,0,0,.08);min-height:22vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .card .e{font-size:10vh;line-height:1.1}
  .card .w{font-size:3vh;font-weight:bold}
  .card.gap{background:transparent;box-shadow:none;border:.5vh dashed #cbd5e1}
  .card.gap *{visibility:hidden}
  .dark{position:fixed;inset:0;background:#0f172a;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:3vh;z-index:50;cursor:pointer}
  .dark.show{display:flex}
  .dark p{font-size:9vh}
  .prog{font-size:2.6vh;color:var(--muted)}
  .hidden{display:none!important}
  img.ph{height:1em;width:auto;max-width:2.2em;object-fit:contain;vertical-align:middle}
  .note{background:#fff7ed;border:.3vh solid #fed7aa;border-radius:2vh;padding:1.5vh 2vw;font-size:2.4vh;max-width:1400px}
</style>
</head>

<header>
  <h1>🇬🇧 6A • Révision vocabulaire</h1>
  <div class="teams">
    <div class="team a">Team 1 <button onclick="pt('a',-1)">−</button><b id="sa">0</b><button onclick="pt('a',1)">+</button></div>
    <div class="team b">Team 2 <button onclick="pt('b',-1)">−</button><b id="sb">0</b><button onclick="pt('b',1)">+</button></div>
    <button class="ghost" onclick="home()">🏠 Menu</button>
  </div>
</header>

<main id="app"></main>

let sel=new Set(Object.keys(CATS));
const S={a:0,b:0};
function pt(t,d){S[t]=Math.max(0,S[t]+d);document.getElementById('s'+t).textContent=S[t]}
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=(needPic)=>V.filter(v=>sel.has(v.c)&&(!needPic||v.e));
const picHTML=v=>v.e?`<div class="pic">${v.e}</div>`:`<div class="pic txt">${v.fr}</div>`;
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[!?.,]/g,"").replace(/^(a|an|the) /,"").replace(/\s+/g," ").trim();

/* Voix anglaise */
let voice=null;
function loadVoice(){voice=(()=>{const vs=speechSynthesis.getVoices();const en=vs.filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith("en"));
  const pref=["Serena","Kate","Stephanie","Martha","Google UK English Female","Libby","Sonia","Hazel","Susan","Maisie","Samantha","Karen","Moira","Tessa","Aria","Jenny","Zira","Google US English"];
  const male=/(Daniel|Arthur|Oliver|Ryan|George|Thomas|Alex|Fred|Rishi|Aaron|Guy|David|Mark|James|Male)/i;
  for(const n of pref){const f=en.find(v=>v.name.includes(n));if(f)return f}
  return en.find(v=>/female|woman/i.test(v.name))||en.find(v=>v.lang.replace("_","-")==="en-GB"&&!male.test(v.name))||en.find(v=>!male.test(v.name))||en[0]||null})()}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t,rate=.85){if(!('speechSynthesis' in window))return alert("La synthèse vocale n'est pas disponible sur ce navigateur.");
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=rate*.92;u.pitch=1.1;speechSynthesis.speak(u)}

/* ===== MENU ===== */
function home(){
  speechSynthesis&&speechSynthesis.cancel();
  app.innerHTML=`
  <h2 class="title">Choose a game! 🎮</h2>
  <div class="cats">${Object.entries(CATS).map(([k,l])=>`<label><input type="checkbox" ${sel.has(k)?'checked':''} onchange="tog('${k}',this.checked)">${l}</label>`).join('')}</div>
  <div class="menu">
    <div class="mode" onclick="startWrite()"><div class="i">✍️</div><h2>Écrit</h2><p>Une image → écris le mot en anglais (ardoise ou clavier).</p></div>
    <div class="mode" onclick="startSay()"><div class="i">🗣️</div><h2>Prononciation</h2><p>Une image → dis le mot, puis écoute le modèle.</p></div>
    <div class="mode" onclick="startListen()"><div class="i">👂</div><h2>Listen and find</h2><p>Écoute le mot et trouve la bonne image.</p></div>
    <div class="mode" onclick="startMemory()"><div class="i">🧠</div><h2>Memory</h2><p>Retrouve les paires image ↔ mot anglais.</p></div>
    <div class="mode" onclick="startTrad()"><div class="i">🇫🇷➡️🇬🇧</div><h2>Traduction</h2><p>Un mot français → choisis le bon mot anglais.</p></div>
    <div class="mode" onclick="startMissing()"><div class="i">🙈</div><h2>What's missing?</h2><p>Une carte disparaît… laquelle ?</p></div>
  </div>
  <div class="note">📷 Quand un mot n'a pas d'image, c'est le mot français qui s'affiche à la place (cadre violet).</div>`;
}
function tog(k,on){on?sel.add(k):sel.delete(k)}
function guard(list,n){if(list.length<n){alert("Coche plus de thèmes pour ce jeu !");return false}return true}

/* ===== ÉCRIT ===== */
let Q=[],qi=0;
function startWrite(){Q=shuffle(pool());if(!guard(Q,1))return;qi=0;drawWrite()}
function drawWrite(){
  const v=Q[qi];
  app.innerHTML=`<h2 class="title">✍️ Write the word!</h2><p class="prog">${qi+1} / ${Q.length} • ${CATS[v.c]}</p>
  <div class="big">${picHTML(v)}${v.e?`<div class="fr">${v.fr}</div>`:''}
    <input class="write" id="w" placeholder="…" autocomplete="off" onkeydown="if(event.key==='Enter')checkW()">
    <div class="ans hidden" id="a">${v.en}</div></div>
  <div class="btns"><button onclick="checkW()">Vérifier</button><button class="alt" onclick="revA()">Réponse 👀</button>
  <button class="ghost" onclick="say('${esc(v.en)}')">🔊</button><button onclick="nextQ(drawWrite)">Suivant ▶</button></div>
  <p class="sub">Sans clavier : les élèves écrivent sur l'ardoise, « Slates up! », puis Réponse.</p>`;
  document.getElementById('w').focus();
}
function checkW(){const i=document.getElementById('w');const ok=norm(i.value)===norm(Q[qi].en);
  i.className='write '+(ok?'ok':'ko');if(ok){revA();say(Q[qi].en)}}
function revA(){document.getElementById('a').classList.remove('hidden')}
function nextQ(f){qi++;if(qi>=Q.length){finish();return}f()}
function esc(s){return s.replace(/'/g,"\\'")}

/* ===== PRONONCIATION ===== */
function startSay(){Q=shuffle(pool());if(!guard(Q,1))return;qi=0;drawSay()}
function drawSay(){
  const v=Q[qi];
  app.innerHTML=`<h2 class="title">🗣️ Say it!</h2><p class="prog">${qi+1} / ${Q.length} • ${CATS[v.c]}</p>
  <div class="big">${picHTML(v)}<div class="ans hidden" id="a">${v.en}</div></div>
  <div class="btns"><button class="alt" onclick="revA();say('${esc(v.en)}')">🔊 Écouter le modèle</button>
  <button class="ghost" onclick="say('${esc(v.en)}',.55)">🐢 Lentement</button>
  <button onclick="nextQ(drawSay)">Suivant ▶</button></div>
  <p class="sub">1. Un élève (ou une team) dit le mot. 2. On écoute le modèle. 3. Toute la classe répète 3 fois : fort, chuchoté, en chantant !</p>`;
}

/* ===== LISTEN AND FIND ===== */
function startListen(){Q=shuffle(pool(true));if(!guard(Q,4))return;qi=0;drawListen()}
function drawListen(){
  const v=Q[qi];const others=shuffle(pool(true).filter(x=>x.en!==v.en&&x.e!==v.e)).slice(0,3);
  const ch=shuffle([v,...others]);
  app.innerHTML=`<h2 class="title">👂 Listen and find!</h2><p class="prog">${qi+1} / ${Q.length}</p>
  <div class="btns"><button class="alt" style="font-size:4vh" onclick="say('${esc(v.en)}')">🔊 Listen!</button><button class="ghost" onclick="say('${esc(v.en)}',.55)">🐢</button></div>
  <div class="choices">${ch.map(x=>`<div class="choice" data-ok="${x.en===v.en}" onclick="pick(this)"><span class="e">${x.e}</span></div>`).join('')}</div>
  <div class="ans hidden" id="a">${v.en}</div>
  <div class="btns"><button onclick="nextQ(drawListen)">Suivant ▶</button></div>`;
  setTimeout(()=>say(v.en),400);
}
function pick(el){const ok=el.dataset.ok==="true";el.classList.add(ok?'ok':'ko');if(ok)revA()}

/* ===== TRADUCTION ===== */
function startTrad(){Q=shuffle(pool());if(!guard(Q,4))return;qi=0;drawTrad()}
function drawTrad(){
  const v=Q[qi];const same=pool().filter(x=>x.c===v.c&&x.en!==v.en);
  const others=shuffle(same.length>=3?same:pool().filter(x=>x.en!==v.en)).slice(0,3);
  const ch=shuffle([v,...others]);
  app.innerHTML=`<h2 class="title">🇫🇷 ➡️ 🇬🇧</h2><p class="prog">${qi+1} / ${Q.length} • ${CATS[v.c]}</p>
  <div class="big" style="min-height:22vh"><div style="font-size:7vh">${v.fr}</div></div>
  <div class="choices">${ch.map(x=>`<div class="choice" data-ok="${x.en===v.en}" onclick="pick(this);if(this.dataset.ok==='true')say('${esc(v.en)}')">${x.en}</div>`).join('')}</div>
  <div class="ans hidden" id="a"></div>
  <div class="btns"><button onclick="nextQ(drawTrad)">Suivant ▶</button></div>`;
}

/* ===== MEMORY ===== */
let mFirst=null,mLock=false,mFound=0,mN=0;
function startMemory(n){
  const p=pool(true);if(!guard(p,4))return;
  mN=Math.min(n||8,p.length);
  const picks=shuffle(p).filter((v,i,a)=>a.findIndex(x=>x.e===v.e)===i).slice(0,mN);mN=picks.length;
  const cards=shuffle(picks.flatMap((v,i)=>[{k:i,h:`<span class="e">${v.e}</span>`,en:v.en},{k:i,h:v.en,en:v.en}]));
  mFirst=null;mLock=false;mFound=0;
  const cols=mN<=6?4:mN<=8?4:5;
  app.innerHTML=`<h2 class="title">🧠 Memory</h2>
  <div class="btns"><button class="ghost" onclick="startMemory(6)">6 paires</button><button class="ghost" onclick="startMemory(8)">8 paires</button><button class="ghost" onclick="startMemory(10)">10 paires</button></div>
  <div class="memo" style="grid-template-columns:repeat(${cols},1fr)">${cards.map(c=>`<div class="mc" data-k="${c.k}" data-en="${esc(c.en)}" onclick="flip(this)"><div class="in"><div class="f">?</div><div class="b">${c.h}</div></div></div>`).join('')}</div>
  <p class="sub">À tour de rôle par team : quand on retourne le mot, on le lit à voix haute !</p>`;
}
function flip(el){
  if(mLock||el.classList.contains('flip')||el.classList.contains('done'))return;
  el.classList.add('flip');
  if(!mFirst){mFirst=el;return}
  if(mFirst.dataset.k===el.dataset.k){
    const a=mFirst;mFirst=null;say(el.dataset.en);
    setTimeout(()=>{a.classList.add('done');el.classList.add('done');mFound++;if(mFound===mN)setTimeout(finish,800)},400);
  }else{mLock=true;const a=mFirst;mFirst=null;setTimeout(()=>{a.classList.remove('flip');el.classList.remove('flip');mLock=false},1200)}
}

/* ===== WHAT'S MISSING ===== */
let wm=[],wmG=[];
function startMissing(){const p=pool(true).filter((v,i,a)=>a.findIndex(x=>x.e===v.e)===i);if(!guard(p,6))return;wm=shuffle(p).slice(0,6);wmG=[];drawMissing()}
function drawMissing(){
  app.innerHTML=`<h2 class="title">🙈 What's missing?</h2>
  <div class="grid6">${wm.map((v,i)=>`<div class="card ${wmG.includes(i)?'gap':''}"><div class="e">${v.e}</div><div class="w">${v.en}</div></div>`).join('')}</div>
  <div class="btns"><button class="warn" onclick="hideWM(1)">🙈 Close your eyes! (1)</button><button class="warn" onclick="hideWM(2)">🙈 Close your eyes! (2)</button>
  <button class="alt" onclick="revA();say(document.getElementById('a').textContent)">Réponse</button><button onclick="startMissing()">↺ Nouvelles cartes</button></div>
  <div class="ans hidden" id="a">${wmG.map(i=>wm[i].en).join(' and ')}</div>`;
}
function hideWM(n){wmG=shuffle([0,1,2,3,4,5]).slice(0,n);const d=document.getElementById('dark');d.classList.add('show');d.onclick=()=>d.classList.remove('show');drawMissing()}

/* ===== FIN ===== */
function finish(){
  const w=S.a===S.b?"🤝 It's a draw!":(S.a>S.b?"🏆 Team 1 wins!":"🏆 Team 2 wins!");
  app.innerHTML=`<div class="big"><div class="pic">🎉</div><h2 class="title">Well done!</h2><p style="font-size:4vh">${(S.a||S.b)?w:''}</p></div>
  <div class="btns"><button onclick="home()">🏠 Menu</button></div>`;
  say("Well done!");
}
home();
</script>
