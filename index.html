  .dark{position:fixed;inset:0;background:#0f172a;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:3vh;z-index:50;cursor:pointer}
  .dark.show{display:flex}

  nav{position:fixed;bottom:1.8vh;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:1.6vw;z-index:40}

/* ================= MOTEUR ================= */
const stage=document.getElementById('stage');
let S=null,cur=0;
const pic=(v,size)=>v.e?v.e:`<span class="frpic" style="font-size:${size||3}vh">${v.fr}</span>`;
const withPic=set=>set.filter(v=>v.e);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
let voice=null;
function loadVoice(){voice=(()=>{const vs=speechSynthesis.getVoices();const en=vs.filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith("en"));
  const pref=["Serena","Kate","Stephanie","Martha","Google UK English Female","Libby","Sonia","Hazel","Susan","Maisie","Samantha","Karen","Moira","Tessa","Aria","Jenny","Zira","Google US English"];
  const male=/(Daniel|Arthur|Oliver|Ryan|George|Thomas|Alex|Fred|Rishi|Aaron|Guy|David|Mark|James|Male)/i;
  for(const n of pref){const f=en.find(v=>v.name.includes(n));if(f)return f}
  return en.find(v=>/female|woman/i.test(v.name))||en.find(v=>v.lang.replace("_","-")==="en-GB"&&!male.test(v.name))||en.find(v=>!male.test(v.name))||en[0]||null})()}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t,rate=.85){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\w\s',.!?-]/g,""));u.lang="en-GB";if(voice)u.voice=voice;u.rate=rate*.92;u.pitch=1.1;speechSynthesis.speak(u)}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}
function rev(el){el.querySelectorAll('.answer,.a').forEach(a=>a.classList.toggle('show'))}
function darkOn(txt){const d=document.getElementById('dark');document.getElementById('darkTxt').innerHTML=txt||"🙈 Close your eyes!";d.classList.add('show');d.onclick=()=>d.classList.remove('show')}

function home(){
  S=null;speechSynthesis&&speechSynthesis.cancel();
  stage.className="menu";stage.style.removeProperty('--c');
  document.getElementById('count').textContent="";document.getElementById('nav').style.display="none";
  const weeks={};SESS.forEach(s=>(weeks[s.week]=weeks[s.week]||[]).push(s));
  stage.innerHTML=`<h1 style="color:var(--xmas)">🎃 L'étrange Noël de Mister Jack 🎄</h1>
  <p class="small">6A • Period 2 • 12 séances • choisis la séance du jour</p>
  <div class="btns"><button class="alt" onclick="window.open('entrainement.html','_blank')">🏋️ Tous les entraînements</button></div>
  <div class="weeks">${Object.entries(weeks).map(([w,ss])=>`<div class="week"><h3>${w}</h3>${ss.map(s=>`<div class="sess" onclick="open_(${s.n-1})"><span class="ic">${s.ic}</span><div><b>Séance ${s.n} – ${s.title}</b><span>${s.sub}</span></div></div>`).join('')}</div>`).join('')}</div>`;
}
function open_(i){document.getElementById('nav').style.display="";S=SESS[i];cur=0;stage.className="";stage.style.setProperty('--c',S.c);draw()}
function go(d){if(!S)return;const n=cur+d;if(n<0||n>=S.slides.length)return;cur=n;draw()}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
  if(e.key==='Escape')document.getElementById('dark').classList.remove('show');
});

function head(sl){return `<span class="tag">Séance ${S.n}</span>${sl.time?`<span class="time">⏱ ${sl.time}</span>`:''}`}
function draw(){
  speechSynthesis&&speechSynthesis.cancel();
  const sl=S.slides[cur];
  document.getElementById('count').textContent=`Séance ${S.n} • ${cur+1} / ${S.slides.length}`;
  stage.innerHTML=head(sl)+(R[sl.t]||R.box)(sl);
  if(sl.t==="flash")flashNext(true);
  if(sl.t==="wm")wmNew();
  if(sl.t==="listen")lfNew();
  if(sl.t==="say")sayNew(true);
  if(sl.t==="memory")memNew();
  if(sl.t==="where")whereNew();
}

   <div class="prof">Prof : un élève dit le mot, on écoute le modèle, toute la classe répète.</div>`,
 listen:sl=>`<h2>👂 Listen and find!</h2><div class="btns"><button class="alt" style="font-size:3.8vh" onclick="say(LF.w)">🔊 Listen!</button><button class="ghost" onclick="say(LF.w,.55)">🐢</button><button onclick="lfNew()">Suivant ▶</button></div><div class="choices" id="lfC"></div><p class="answer big" id="lfA"></p>`,

 rule:sl=>`<h2>Pronouns: he, she, it or they? 📌</h2><div class="box" style="display:grid;grid-template-columns:repeat(2,minmax(30vw,auto));gap:2vh 4vw;text-align:left">
   <p>👦 <b>he</b> → for a boy<br><span class="small">Jack is hiding. → <b>He</b> is hiding.</span></p>
   <p>👧 <b>she</b> → for a girl<br><span class="small">Sally is clapping. → <b>She</b> is clapping.</span></p>
   <p>🌕 <b>it</b> → for a thing (or an animal)<br><span class="small">The moon is shining. → <b>It</b> is shining.</span></p>
   <p>👻👻 <b>they</b> → for two or more<br><span class="small">The monsters are playing music. → <b>They</b> are playing music.</span></p></div>`,
 pick:sl=>`<h2>${sl.h}</h2><ol class="q">${sl.items.map((q,i)=>`<li onclick="rev(this);say('${esc(q[1])}')"><span class="n">${i+1}</span>${q[0]} <span class="answer">→ ${q[1]}</span></li>`).join('')}</ol><p class="small">${sl.opts.join(" • ")}</p><div class="prof">Prof : les élèves lèvent ☝️ He, ✌️ She, 🤟 It, 🖐️ They (ou ardoise), puis clic.</div>`,
 tf:sl=>`<h2>${sl.h}</h2><div class="tf">${sl.items.map(q=>`<div class="s" onclick="this.nextElementSibling.classList.toggle('show')">${q[0]}</div><div class="a">${q[1]}</div>`).join('')}</div>${sl.prof?`<div class="prof">Prof : ${sl.prof}</div>`:''}`,
 preps:sl=>`<h2>${sl.h||"Prepositions 📦"}</h2><div class="prep">${PREPS.map(p=>`<div class="card" onclick="say('${p.w}')" style="cursor:pointer">${miniScene(p.k)}<div class="w">${p.w}</div><div class="small">${p.fr}</div></div>`).join('')}</div><p class="small">🔊 Clique pour entendre.</p>`,

/* ---- Flash ---- */
let FL=[],fi=0;
function flashNext(reset){const sl=S.slides[cur];if(reset||fi>=FL.length-1){FL=shuffle(SETS[sl.set]);fi=0}else fi++;
  document.getElementById('flE').innerHTML=pic(FL[fi],6);const w=document.getElementById('flW');w.textContent=FL[fi].w;w.classList.remove('show')}
/* ---- What's missing ---- */
let WM=[],WG=[];
function wmNew(){WM=shuffle(withPic(SETS[S.slides[cur].set])).slice(0,6);WG=[];wmDraw();document.getElementById('wmA').classList.remove('show')}
function wmDraw(){document.getElementById('wmG').innerHTML=WM.map((v,i)=>`<div class="card ${WG.includes(i)?'gap':''}"><div class="e">${v.e}</div><div class="w">${v.w}</div></div>`).join('')}
function wmHide(n){WG=shuffle([0,1,2,3,4,5]).slice(0,n);darkOn();wmDraw();const a=document.getElementById('wmA');a.textContent=WG.map(i=>WM[i].w).join(" and ")+(WG.length>1?" are":" is")+" missing!";a.classList.remove('show')}
function wmAns(){const a=document.getElementById('wmA');a.classList.add('show');say(a.textContent)}
/* ---- Say it ---- */
let SY=[],si=0;
function sayNew(reset){if(reset||si>=SY.length-1){SY=shuffle(SETS[S.slides[cur].set]);si=0}else si++;
  document.getElementById('syE').innerHTML=pic(SY[si],6);const w=document.getElementById('syW');w.textContent=SY[si].w;w.classList.remove('show')}
/* ---- Listen and find ---- */
let LF=null;
function lfNew(){const set=withPic(SETS[S.slides[cur].set]);LF=set[Math.random()*set.length|0];
  const ch=shuffle([LF,...shuffle(set.filter(x=>x!==LF)).slice(0,3)]);
  document.getElementById('lfC').innerHTML=ch.map(x=>`<div class="choice" onclick="this.classList.add(${x===LF}?'ok':'ko');if(${x===LF})document.getElementById('lfA').classList.add('show')"><span class="e">${x.e}</span></div>`).join('');
  const a=document.getElementById('lfA');a.textContent=LF.w;a.classList.remove('show');setTimeout(()=>say(LF.w),350)}
/* ---- Memory ---- */
let mF=null,mL=false,mFound=0,mN=0;
function memNew(){const sl=S.slides[cur];const set=shuffle(withPic(SETS[sl.set])).filter((v,i,a)=>a.findIndex(x=>x.w===v.w)===i).slice(0,sl.n||6);mN=set.length;
  const cards=shuffle(set.flatMap((v,i)=>[{k:i,h:`<span class="e">${v.e}</span>`,w:v.w},{k:i,h:v.w,w:v.w}]));mF=null;mL=false;mFound=0;
  const m=document.getElementById('mem');m.style.gridTemplateColumns=`repeat(${mN*2>12?8:6},1fr)`;
  m.innerHTML=cards.map(c=>`<div class="mc" data-k="${c.k}" data-w="${c.w.replace(/"/g,'&quot;')}" onclick="flip(this)"><div class="in"><div class="f">?</div><div class="b">${c.h}</div></div></div>`).join('')}
function flip(el){if(mL||el.classList.contains('flip')||el.classList.contains('done'))return;el.classList.add('flip');
  if(!mF){mF=el;return}
  if(mF.dataset.k===el.dataset.k){const a=mF;mF=null;say(el.dataset.w);setTimeout(()=>{a.classList.add('done');el.classList.add('done');mFound++;if(mFound===mN)setTimeout(()=>{darkOn("🎉 Well done!");say("Well done!")},600)},400)}
  else{mL=true;const a=mF;mF=null;setTimeout(()=>{a.classList.remove('flip');el.classList.remove('flip');mL=false},1200)}}
/* ---- Prépositions ---- */
const PREPS=[{k:"in",w:"in",fr:"dans"},{k:"on",w:"on",fr:"sur"},{k:"under",w:"under",fr:"sous"},{k:"behind",w:"behind",fr:"derrière"},{k:"next",w:"next to",fr:"à côté de"},{k:"front",w:"in front of",fr:"devant"},{k:"between",w:"between",fr:"entre"}];
/* positions en % : [x,y,taille relative, zIndex] du monstre par rapport à la boîte centrée (50,55) */
const POS={in:[50,60,.55,3],on:[50,22,.8,3],under:[50,92,.6,3],behind:[58,42,.8,1],next:[78,58,.8,3],front:[46,70,1.05,4],between:[50,58,.8,3]};
function miniScene(k){const p=POS[k];const two=k==="between";
  return `<div style="position:relative;width:12vw;height:10vh;margin:0 auto">${two?`<span style="position:absolute;left:18%;top:55%;transform:translate(-50%,-50%);font-size:4.5vh">📦</span><span style="position:absolute;left:82%;top:55%;transform:translate(-50%,-50%);font-size:4.5vh">📦</span>`:`<span style="position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:5.5vh;z-index:2">${k==="in"?"🗑️":"📦"}</span>`}<span style="position:absolute;left:${p[0]}%;top:${p[1]}%;transform:translate(-50%,-50%);font-size:${3.6*p[2]}vh;z-index:${p[3]};${k==="behind"?"filter:brightness(.8);":""}">👻</span></div>`}
const MONS=[{e:"👹",w:"the monster"},{e:"👻",w:"the ghost"},{e:"🦇",w:"the bat"},{e:"🕷️",w:"the spider"},{e:"🎃",w:"the jack-o'-lantern"},{e:"🐈‍⬛",w:"the cat"}];
const OBJS=[{e:"📦",w:"the box"},{e:"🪑",w:"the chair"},{e:"🎁",w:"the present"}];
let WH=null;
function whereNew(){const p=PREPS[Math.random()*PREPS.length|0];const m=MONS[Math.random()*MONS.length|0];const o=OBJS[Math.random()*OBJS.length|0];
  if(WH&&WH.p===p&&PREPS.length>1)return whereNew();
  WH={p,m,o};const q=POS[p.k];const sc=document.getElementById('scene');
  const objs=p.k==="between"?`<span class="obj" style="left:28%;top:55%">${o.e}</span><span class="obj" style="left:72%;top:55%">${o.e}</span>`
    :`<span class="obj" style="left:50%;top:55%;z-index:2">${p.k==="in"?"🗑️":o.e}</span>`;
  const top=p.k==="under"?86:q[1];
  sc.innerHTML=`<div class="floor"></div>${objs}<span class="mon" style="left:${p.k==="next"?74:q[0]}%;top:${top}%;font-size:${9*q[2]}vh;z-index:${q[3]};${p.k==="behind"?"filter:brightness(.75);":""}">${m.e}</span>`;
  const objW=p.k==="in"?"the bin":(p.k==="between"?"the two "+plural(o.w.replace("the ","")):o.w);
  const a=document.getElementById('whA');a.textContent=`${cap(m.w)} is ${p.w} ${objW}.`;a.classList.remove('show');
  document.getElementById('whH').textContent=`Where is ${m.w}? ${m.e}`;
  document.querySelector('.prof').textContent=`Prof : « Where is ${m.w}? » → les élèves répondent : « It's ${p.w} … ! »`}
function plural(w){return w.endsWith("x")?w+"es":w+"s"}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function whereAns(){const a=document.getElementById('whA');a.classList.add('show');say(a.textContent)}

home();
